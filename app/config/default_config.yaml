# eFloStop II Production Tool — Default Configuration

general:
  company_name: "eFloStop"
  tool_version: "1.0.0"
  data_dir: "data"            # Relative to app root; holds SQLite + JSONL records

firmware:
  manifest_path: "firmware/manifest.yaml"

flash:
  esp_baud: 460800
  stm32_programmer_cli: "C:\\Program Files\\STMicroelectronics\\STM32Cube\\STM32CubeProgrammer\\bin\\STM32_Programmer_CLI.exe"

serial_number:
  prefix_by_device:
    hub: "EFS2H"
    valve: "EFS2V"
    sensor: "EFS2S"

ble_scan:
  timeout_seconds: 15
  hub_name_prefix: "eFloStop"
  valve_name_prefix: "eFloStop"
  sensor_name_prefix: "eleak"

# Label printing. The label itself is fixed at 20 mm x 20 mm by the
# manufacturing spec and is not configurable. These are factory defaults only —
# the operator's selection and per-machine settings are stored per user and
# survive upgrades. See docs/PRINTER_BACKENDS.md.
label_printer:
  backend: "system"           # "system" | "puqu_aq20" | "zpl_tcp"
  backends:                   # per-backend defaults; each backend validates its own
    puqu_aq20:
      printer_name: ""        # exact Windows queue name; blank = choose in Printer Setup
      resolution_dpi: 203     # AQ20 print head is 203 dpi
    zpl_tcp:
      host: ""
      port: 9100

test:
  boot_log_timeout_seconds: 15
  battery_voltage_min: 2.5
  battery_voltage_max: 3.3

skus:
  hub: "EFS2-HUB-NA"
  valve: "EFS2-VLV-1IN"
  sensor: "EFS2-LKS-BLE"

hw_revision: "C"
